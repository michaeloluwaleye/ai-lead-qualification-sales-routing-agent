<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-label="Brevo to Make validation scoring and routing architecture">
<rect width="1080" height="420" fill="#f4f8fb"/>
<text x="35" y="38" font-size="24" font-family="Arial" fill="#123047" font-weight="bold">Implemented MVP architecture</text>
<g font-family="Arial" font-size="16" text-anchor="middle">
<rect x="30" y="150" width="155" height="82" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="107" y="183" fill="#17345b">Brevo contacts</text><text x="107" y="204" font-size="12" fill="#17345b">Watch Contacts</text>
<rect x="225" y="150" width="160" height="82" rx="12" fill="#e2e8f0" stroke="#475569"/><text x="305" y="180" fill="#17345b">Required fields</text><text x="305" y="203" fill="#17345b">Router 13</text>
<rect x="425" y="150" width="160" height="82" rx="12" fill="#ccfbf1" stroke="#0f766e"/><text x="505" y="180" fill="#17345b">Normalise and</text><text x="505" y="203" fill="#17345b">validate (R17)</text>
<rect x="625" y="150" width="150" height="82" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="700" y="180" fill="#17345b">15-point score</text><text x="700" y="203" fill="#17345b">Router 8</text>
<rect x="830" y="62" width="210" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="935" y="99" fill="#17345b">Hot → Slack</text>
<rect x="830" y="160" width="210" height="64" rx="10" fill="#fef9c3" stroke="#ca8a04"/><text x="935" y="197" fill="#17345b">Warm → Slack</text>
<rect x="830" y="258" width="210" height="64" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="935" y="295" fill="#17345b">Cold → Brevo nurture</text>
<rect x="360" y="323" width="310" height="62" rx="10" fill="#f3e8ff" stroke="#7e22ce"/><text x="515" y="348" fill="#17345b">Incomplete / invalid → Slack</text><text x="515" y="370" font-size="12" fill="#17345b">Human review (no automated scoring)</text>
</g>
